context.properties = {
    # Base rate matches SOF hardware ceiling.
    # allowed-rates enables clock-following for HDMI sessions —
    # PipeWire will switch the graph to the stream's native rate
    # (if the device supports it) so no resampling occurs.
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]

    # 1024 @ 48kHz ≈ 21ms — stable on SOF/SoundWire
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 8192
}

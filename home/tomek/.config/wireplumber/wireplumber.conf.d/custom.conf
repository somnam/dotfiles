monitor.alsa.rules = [
  {
    # Internal speakers — SOF firmware hard-caps at 48000 Hz
    matches = [{ node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Speaker__sink" }]
    actions = {
      update-props = {
        audio.format         = S32LE
        audio.rate           = 48000
        api.alsa.period-size = 1024
        api.alsa.headroom    = 2048
        resample.quality     = 10
        channelmix.normalize = true
      }
    }
   }
   {
     # Headphone jack — same SOF card, same 48000 Hz ceiling
     matches = [{ node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Headphones__sink" }]
     actions = {
       update-props = {
         audio.format         = S32LE
         audio.rate           = 48000
         api.alsa.period-size = 1024
         api.alsa.headroom    = 2048
         resample.quality     = 10
         channelmix.normalize = true
       }
     }
   }
   {
    # HDMI 1/2/3 — Lunar Lake HDA codec supports up to 192000 Hz.
    # audio.rate is NOT hardcoded here so that PipeWire's clock-following
    # (allowed-rates in pipewire.conf.d) can switch the graph — and this
    # device — to whatever rate the active stream natively uses.
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__HDMI1__sink" }
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__HDMI2__sink" }
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__HDMI3__sink" }
    ]
    actions = {
      update-props = {
        audio.format         = S32LE
        api.alsa.period-size = 1024
        api.alsa.headroom    = 1024
        resample.quality     = 10
      }
    }
  }
]
